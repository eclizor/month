<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthsary Bouquet</title>
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
background: #080914;
color: #f8e8f4;
font-family: system-ui, sans-serif;
min-height: 100vh;
display: grid;
place-items: center;
}
main {
width: min(100%, 1000px);
padding: 16px;
text-align: center;
}
canvas {
width: 100%;
height: min(76vh, 720px);
display: block;
background: radial-gradient(
ellipse at 50% 55%,
#22152b 0%,
#0c0b19 55%,
#05060d 100%
);
border: 1px solid #422641;
border-radius: 16px;
}
p {

color: #d8b9d4;
margin: 10px 0 0;
font-size: 14px;
}
</style>
</head>
<body>
<main>
<canvas id="scene"></canvas>
<p>Happy monthsary ♥</p>
</main>
<script>
"use strict";
// Animation settings
const FPS = 24;
const SPIN_SPEED = 0.6;
const TILT = 0.30;
const CAM_DIST = 4.0;
const MESSAGE =
"Happy monthsary, my sweet sweet girl, I hope you like this. ♥";
const NUM_HEARTS = 67;
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let width = 800;
let height = 600;
let frame = 0;
let lastFrame = 0;
let angle = 0;
let hearts = [];
let stars = [];
let sparkles = [];
// Resize canvas
function resize() {
const dpr = Math.min(devicePixelRatio || 1, 2);
const rect = canvas.getBoundingClientRect();

width = Math.max(1, rect.width);
height = Math.max(1, rect.height);
canvas.width = Math.floor(width * dpr);
canvas.height = Math.floor(height * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();
// Random number helper
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) =>
Math.max(a, Math.min(b, v));
// Create floating hearts
function makeHeart() {
return {
x: rand(-2.3, 2.3),
y: rand(-2.4, 2.4),
z: rand(-1.4, 1.4),
speed: rand(0.22, 0.62),
size: rand(3, 9),
phase: rand(0, Math.PI * 2),
hue: rand(325, 355),
alpha: rand(0.35, 0.9)
};
}
for (let i = 0; i < NUM_HEARTS; i++) {
hearts.push(makeHeart());
}
// Background stars
for (let i = 0; i < 90; i++) {
stars.push({
x: rand(-2.8, 2.8),
y: rand(-2.4, 2.4),
z: rand(-2, 2),
s: rand(0.4, 1.8),

p: rand(0, 6.28)
});
}
// Sparkles
for (let i = 0; i < 30; i++) {
sparkles.push({
x: rand(-2, 2),
y: rand(-2, 2),
z: rand(-1, 1),
p: rand(0, 6.28),
s: rand(1, 3)
});
}
// Rotate 3D point
function rotate(p, a) {
const x =
p.x * Math.cos(a) -
p.z * Math.sin(a);
const z =
p.x * Math.sin(a) +
p.z * Math.cos(a);
const y =
p.y * Math.cos(TILT) -
z * Math.sin(TILT);
return {
x: x,
y: y,
z:
p.y * Math.sin(TILT) +
z * Math.cos(TILT)
};
}
// Project 3D coordinates onto canvas
function project(p) {
const q = rotate(p, angle);
const k =
CAM_DIST /

(CAM_DIST + q.z + 3.1);
return {
x: width / 2 + q.x * k * width * 0.27,
y: height * 0.56 - q.y * k * height * 0.27,
scale: k,
depth: q.z
};
}
// Draw a point
function dot(p, color, size, alpha = 1) {
const q = project(p);
ctx.globalAlpha = alpha;
ctx.fillStyle = color;
ctx.beginPath();
ctx.arc(
q.x,
q.y,
Math.max(0.5, size * q.scale),
0,
Math.PI * 2
);
ctx.fill();
}
// Draw a 3D line
function line3(a, b, color, w = 2, alpha = 1) {
const p = project(a);
const q = project(b);
ctx.globalAlpha = alpha;
ctx.strokeStyle = color;
ctx.lineWidth =
Math.max(0.5, w * (p.scale + q.scale) / 2);
ctx.beginPath();
ctx.moveTo(p.x, p.y);
ctx.lineTo(q.x, q.y);
ctx.stroke();

}
// Draw flower
function drawFlower(
cx,
cy,
cz,
petalCount,
size,
kind,
phase
) {
const petals =
kind === "tulip" ? 5 : petalCount;
// Flower petals
for (let layer = 0; layer < 3; layer++) {
for (let i = 0; i < petals; i++) {
const a =
i * Math.PI * 2 / petals + phase;
const spread =
kind === "tulip" ? 0.68 : 1.0;
const px =
cx + Math.cos(a) * size * 0.42 * spread;
const py =
cy + Math.sin(a) * size * 0.42 * spread;
const pz =
cz + Math.sin(a * 2 + phase) * 0.12 +
layer * 0.018;
const hue =
kind === "tulip"
? 330 + i * 7 + layer * 4
: 305 + i * 9 + layer * 5;
const color =
`hsl(${hue}, 82%, ${62 - layer * 7}%)`;
const radius =
size * (kind === "tulip" ? 0.38 : 0.34);

for (let j = 0; j < 85; j++) {
const rr =
Math.sqrt(Math.random()) * radius;
const aa =
rand(0, Math.PI * 2);
const xx =
px + Math.cos(aa) * rr;
const yy =
py + Math.sin(aa) * rr;
dot(
{
x: xx,
y: yy,
z: pz + rand(-0.035, 0.035)
},
color,
rand(1.1, 2.7),
0.94
);
}
}
}
// Flower center
for (let i = 0; i < 150; i++) {
const r =
Math.sqrt(Math.random()) * size * 0.20;
const a =
rand(0, Math.PI * 2);
dot(
{
x: cx + Math.cos(a) * r,
y: cy + Math.sin(a) * r,
z: cz + 0.08
},
`hsl(${rand(38, 58)}, 95%, ${rand(55, 78)}%)`,
rand(1, 2.5)

);
}
}
// Draw leaves
function drawLeaf(base, dir, len) {
const end = {
x: base.x + dir * len,
y: base.y + len * 0.35,
z: base.z + 0.05
};
let prev = base;
for (let i = 1; i <= 28; i++) {
const t = i / 28;
const bulge =
Math.sin(t * Math.PI) * 0.32;
const p = {
x: base.x + (end.x - base.x) * t,
y:
base.y +
(end.y - base.y) * t +
bulge,
z:
base.z +
Math.sin(t * Math.PI) * 0.08
};
line3(prev, p, "#318c61", 2.6, 0.95);
prev = p;
}
// Leaf vein
line3(base, end, "#70c88b", 0.8, 0.8);
}
// Draw complete bouquet
function drawBouquet() {
const stems = [
{
x: -0.75, y: -1.15, z: 0,

tx: -1.05, ty: 0.35, tz: -0.1
},
{
x: -0.28, y: -1.2, z: 0.1,
tx: -0.35, ty: 0.65, tz: 0.2
},
{
x: 0.25, y: -1.2, z: -0.1,
tx: 0.3, ty: 0.58, tz: -0.2
},
{
x: 0.72, y: -1.15, z: 0.15,
tx: 1.0, ty: 0.28, tz: 0.1
},
{
x: 0, y: -1.3, z: 0,
tx: 0.02, ty: 0.88, tz: 0.05
}
];
// Stems and leaves
stems.forEach((s, i) => {
const base = {
x: s.x,
y: s.y,
z: s.z
};
const top = {
x: s.tx,
y: s.ty,
z: s.tz
};
line3(base, top, "#3f9c68", 3.2);
drawLeaf(
{
x: s.x * 0.55,
y: -0.55,
z: s.z
},
i % 2 ? 1 : -1,
0.55 + Math.random() * 0.15

);
drawLeaf(
{
x: s.x * 0.45,
y: -0.8,
z: s.z
},
i % 2 ? -1 : 1,
0.48
);
});
// Bouquet wrapping
const wrapTop = -0.65;
const wrapBottom = -1.65;
const leftTop = {
x: -0.92,
y: wrapTop,
z: 0
};
const rightTop = {
x: 0.92,
y: wrapTop,
z: 0
};
const leftBottom = {
x: -0.52,
y: wrapBottom,
z: 0.05
};
const rightBottom = {
x: 0.52,
y: wrapBottom,
z: 0.05
};
for (let i = 0; i < 18; i++) {
const t = i / 17;

const a = {
x:
leftTop.x +
(leftBottom.x - leftTop.x) * t,
y:
wrapTop +
(wrapBottom - wrapTop) * t,
z: 0.02
};
const b = {
x:
rightTop.x +
(rightBottom.x - rightTop.x) * t,
y:
wrapTop +
(wrapBottom - wrapTop) * t,
z: 0.02
};
line3(
a,
b,
i % 2 ? "#d9a5c9" : "#b978ae",
1.6,
0.9
);
}
line3(leftTop, leftBottom, "#e8b8d9", 2);
line3(rightTop, rightBottom, "#e8b8d9", 2);
// Ribbon bow
line3(
{ x: -0.35, y: -1.05, z: 0.15 },
{ x: -0.08, y: -0.82, z: 0.18 },
"#ffb3d7",
5
);
line3(
{ x: -0.08, y: -0.82, z: 0.18 },
{ x: -0.34, y: -0.75, z: 0.18 },
"#ffb3d7",

5
);
line3(
{ x: 0.08, y: -0.82, z: 0.18 },
{ x: 0.35, y: -1.05, z: 0.15 },
"#ffb3d7",
5
);
line3(
{ x: 0.08, y: -0.82, z: 0.18 },
{ x: 0.34, y: -0.75, z: 0.18 },
"#ffb3d7",
5
);
// Ribbon tails
line3(
{ x: -0.05, y: -0.83, z: 0.2 },
{ x: -0.22, y: -1.22, z: 0.2 },
"#ff8bc5",
4
);
line3(
{ x: 0.05, y: -0.83, z: 0.2 },
{ x: 0.22, y: -1.22, z: 0.2 },
"#ff8bc5",
4
);
// Flowers
drawFlower(-0.82, 0.62, -0.1, 11, 0.78, "disc", 0.15);
drawFlower(-0.30, 0.98, 0.15, 10, 0.67, "tulip", -0.3);
drawFlower(0.28, 0.88, -0.12, 12, 0.75, "disc", 0.55);
drawFlower(0.82, 0.60, 0.12, 10, 0.72, "tulip", 0.1);
drawFlower(0.02, 1.18, 0.04, 13, 0.83, "disc", -0.2);
}
// Draw heart shape
function heartShape(x, y, size, color, alpha) {
ctx.save();

ctx.translate(x, y);
ctx.scale(size, size);
ctx.globalAlpha = alpha;
ctx.fillStyle = color;
ctx.beginPath();
ctx.moveTo(0, 0.32);
ctx.bezierCurveTo(
-0.8, -0.15,
-0.45, -0.75,
0, -0.38
);
ctx.bezierCurveTo(
0.45, -0.75,
0.8, -0.15,
0, 0.32
);
ctx.fill();
ctx.restore();
}
// Draw messages without neon effects
function drawText() {
ctx.globalAlpha = 1;
ctx.textAlign = "center";
ctx.textBaseline = "middle";
// Main message
ctx.font =
`bold ${Math.max(22, width * 0.045)}px Georgia, serif`;
ctx.fillStyle = "#ffb6d9";
ctx.shadowBlur = 0;
ctx.shadowColor = "transparent";
ctx.fillText(
"I LOVE YOU BABY",
width / 2,
height * 0.85
);

// Monthsary message underneath
ctx.font =
`${Math.max(14, width * 0.022)}px Georgia, serif`;
ctx.fillStyle = "#f4d6e8";
ctx.fillText(
MESSAGE,
width / 2,
height * 0.91
);
ctx.globalAlpha = 1;
ctx.shadowBlur = 0;
}
// Main animation loop
function render(now) {
if (now - lastFrame < 1000 / FPS) {
requestAnimationFrame(render);
return;
}
lastFrame = now;
frame++;
angle += SPIN_SPEED / FPS;
ctx.clearRect(0, 0, width, height);
// Draw stars
stars.forEach(s => {
const tw =
0.4 + 0.6 * Math.sin(frame * 0.035 + s.p);
dot(s, "#fff1fb", s.s, tw);
});
// Draw bouquet
drawBouquet();
// Draw sparkles
sparkles.forEach(s => {

s.p += 0.035;
const q = project({
x: s.x,
y: s.y,
z: s.z
});
const a =
0.25 +
0.75 * Math.abs(
Math.sin(s.p + frame * 0.04)
);
ctx.globalAlpha = a;
ctx.fillStyle = "#fff7cf";
ctx.beginPath();
ctx.arc(
q.x,
q.y,
s.s * q.scale,
0,
Math.PI * 2
);
ctx.fill();
});
// Animate floating hearts
hearts.forEach(h => {
h.y -= h.speed / FPS;
h.x +=
Math.sin(frame * 0.025 + h.phase) * 0.003;
if (h.y < -2.6) {
Object.assign(
h,
makeHeart(),
{ y: 2.6 }
);
}

const q = project(h);
heartShape(
q.x,
q.y,
h.size * q.scale,
`hsl(${h.hue}, 90%, 72%)`,
h.alpha
);
});
// Draw text
drawText();
ctx.globalAlpha = 1;
requestAnimationFrame(render);
}
// Start animation
requestAnimationFrame(render);
</script>
</body>
</html>
